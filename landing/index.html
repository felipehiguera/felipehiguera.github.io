<!doctype html>
<html lang="es-CL">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Felipe Higuera — Dibujo técnico industrial, CAD/CAM y Soporte IT</title>
  <meta
    name="description"
    content="Felipe Higuera: dibujo técnico industrial, modelado CAD/CAM y soporte IT. Planos, modelos y proceso."
  />
  <link rel="icon" type="image/svg+xml" href="/portafolio/favicon.svg" />
  <style>
    :root {
      --bg: #ffffff;
      --fg: #1b1e24;
      --muted: #5a6270;
      --line: #dfe3ea;
      --accent: #0f4c81;
      --font-sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --font-mono: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #101418;
        --fg: #e8ebef;
        --muted: #a7b0bd;
        --line: #2a313b;
        --accent: #7fb3e0;
      }
    }
    * { margin: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      text-align: center;
    }
    main { max-width: 36rem; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: var(--muted);
    }
    h1 {
      margin-top: 0.75rem;
      font-size: clamp(2rem, 9vw, 3rem);
      letter-spacing: -0.02em;
    }
    p { margin-top: 1rem; color: var(--muted); }
    a.boton {
      display: inline-block;
      margin-top: 1.75rem;
      padding: 0.7rem 1.6rem;
      border: 1px solid var(--accent);
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
    a.boton:hover { background: var(--accent); color: var(--bg); }
    footer {
      margin-top: 3rem;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--muted);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Dibujo técnico · CAD/CAM · Soporte IT</p>
    <h1>Felipe Higuera</h1>
    <p>
      Diseñador industrial. Planimetría normada, modelado CAD/CAM y soporte
      de equipos informáticos N1/N2.
    </p>
    <a class="boton" href="/portafolio/">Ver portafolio →</a>
  </main>
  <footer>
    Maipú, Santiago, Chile ·
    <a href="mailto:felipehiguera@outlook.cl">Correo</a> ·
    <a href="https://www.linkedin.com/in/felipe-h-321316284/" target="_blank" rel="me noopener">LinkedIn</a>
  </footer>
</body>
</html>
