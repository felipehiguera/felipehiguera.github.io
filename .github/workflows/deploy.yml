name: Deploy a Cloudflare

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Todo se despliega desde acá: sitio SSR, landing y worker admin. El único
# secreto es el token de Cloudflare (Pages:Edit + Workers Scripts:Edit).
# Ya no hay PAT de GitHub en ningún lado: D1/R2 son la fuente de verdad.
permissions:
  contents: read

concurrency:
  group: "deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Revisar secrets
        run: |
          test -n "${{ secrets.CLOUDFLARE_API_TOKEN }}" || { echo "::error::Falta el secret CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}" || { echo "::error::Falta el secret CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Build SSR
        run: npm run build

      - name: Deploy portfolio (Worker SSR)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy

      - name: Deploy landing (Pages)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler pages deploy landing --project-name=fhiguera --commit-dirty=true

      - name: Deploy worker admin
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # El worker tiene su propio package.json (jose): hay que instalarlo,
        # el npm ci de la raíz no cubre subdirectorios.
        run: |
          npm ci --prefix workers/admin
          npx --no-install wrangler deploy --config workers/admin/wrangler.toml
