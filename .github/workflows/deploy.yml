name: Deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Sin permisos de Pages: el deploy lo hace Wrangler con un API token
# (secret CLOUDFLARE_API_TOKEN) contra la cuenta (secret
# CLOUDFLARE_ACCOUNT_ID). El token necesita permiso Pages:Edit.
permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build para Pages
        # Compila Astro y reordena dist/: landing en raíz,
        # portfolio en /portafolio/ (ver scripts/assemble-dist.mjs).
        run: npm run build:pages

      - name: Deploy a Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=fhiguera --commit-dirty=true
