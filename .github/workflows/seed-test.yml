# Carga única de proyectos de PRUEBA a D1/R2. Se usa una vez y se borra.
# Los proyectos se eliminan después desde el panel (botón Borrar).
name: Seed test data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Subir archivos a R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --no-install wrangler r2 object put portfolio-media/portadas/test-portada-planimetria.webp --file=seed/test-portada-planimetria.webp
          npx --no-install wrangler r2 object put portfolio-media/portadas/test-portada-cnc.webp --file=seed/test-portada-cnc.webp
          npx --no-install wrangler r2 object put portfolio-media/portadas/test-portada-soporte.webp --file=seed/test-portada-soporte.webp
          npx --no-install wrangler r2 object put portfolio-media/planos/test-plano-lamina-01.pdf --file=seed/test-plano-lamina-01.pdf
          npx --no-install wrangler r2 object put portfolio-media/planos/test-plano-mueble-rta.pdf --file=seed/test-plano-mueble-rta.pdf
          npx --no-install wrangler r2 object put portfolio-media/modelos/test-modelo-caja.glb --file=seed/test-modelo-caja.glb

      - name: Insertar filas en D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler d1 execute portfolio --file=seed/seed-test.sql --remote
