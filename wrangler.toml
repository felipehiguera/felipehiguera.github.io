# Worker del portfolio (SSR, con todo prerenderizado por ahora).
#
# Sirve www.fhiguera.fyi/portafolio/*. La raíz de www la sirve el landing
# (Pages) y /portafolio/admin/api el worker admin (ruta más específica,
# gana por precedencia).

name = "portafolio-site"
main = "@astrojs/cloudflare/entrypoints/server"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

[assets]
binding = "ASSETS"
directory = "./dist"

# Lectura de D1 y R2 para las páginas dinámicas y /media/*.
[[d1_databases]]
binding = "DB"
database_name = "portfolio"
database_id = "f301996e-5dbc-4a19-81af-6ca8d2e143dd"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "portfolio-media"

[[routes]]
pattern = "www.fhiguera.fyi/portafolio/*"
zone_name = "fhiguera.fyi"
