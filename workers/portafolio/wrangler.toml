# Proxy del portfolio bajo /portafolio.
#
# www.fhiguera.fyi/portafolio/* -> felipehiguera.github.io/* (origen oculto).
# La raíz de www la sirve el landing (Pages); /api/* lo atiende el worker
# admin. Las rutas de Worker tienen prioridad sobre Pages en el path
# que matchean, así que no hay choque.

name = "portafolio"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[routes]]
pattern = "www.fhiguera.fyi/portafolio*"
zone_name = "fhiguera.fyi"
