# Worker admin: única puerta de escritura al portfolio.
#
# Arquitectura dinámica: D1 es la única fuente de verdad y R2 guarda los
# binarios. Ya no hay Git, ni PAT, ni rebuilds: guardar es instantáneo.
# El navegador llama a /portafolio/admin/api (misma app de Access).
#
# Primero crear los recursos (una vez):
#   wrangler d1 create portfolio
#   wrangler r2 bucket create portfolio-media
# Después completar database_id acá abajo y aplicar el esquema:
#   wrangler d1 execute portfolio --file=workers/admin/schema.sql --remote
#
# Vars no secretas:
#   ACCESS_TEAM  = tu team (mhiguera)
#   ACCESS_AUD   = los AUD de las apps, separados por coma

name = "admin"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
ACCESS_TEAM = "mhiguera"
ACCESS_AUD = "82086987de48e659a9a08f64ccf534b0a35c4f8d51901bb731fb3569fbb4b76f,4b40649877e7b007bbdd7335e0c7680e68488cd40ea97ff50ecf1c709093e223"

[[d1_databases]]
binding = "DB"
database_name = "portfolio"
database_id = "f301996e-5dbc-4a19-81af-6ca8d2e143dd"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "portfolio-media"

[[routes]]
pattern = "www.fhiguera.fyi/portafolio/admin/api"
zone_name = "fhiguera.fyi"
