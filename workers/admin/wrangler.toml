# Worker admin: única puerta de escritura al repo.
#
# La API vive bajo /portafolio/admin/api, DENTRO de la app de Access del
# admin. Así el navegador ya trae la sesión de esa app y el fetch no cruza
# a otra app (eso mataba el request con "failed to fetch"). Mismo origen,
# sin CORS ni claves públicas: Cloudflare deriva al Worker y le adjunta el
# JWT en el header CF-Access-Jwt-Assertion.
#
# Vars no secretas (editar acá):
#   GITHUB_REPO  = "felipehiguera/felipehiguera.github.io"
#   ACCESS_TEAM  = tu team, p. ej. "mi-equipo" (sin https://)
#   ACCESS_AUD   = los dos AUD separados por coma (admin y api):
#                  Zero Trust -> Access -> cada app -> Overview ->
#                  Application Audience (AUD) Tag
#   BRANCH       = "main" (opcional)
#
# Secreto (SOLO por comando, nunca en este archivo):
#   wrangler secret put GITHUB_TOKEN
# El token es un fine-grained PAT con Contents: Read and write,
# limitado al repo de arriba.

name = "admin"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[vars]
GITHUB_REPO = "felipehiguera/felipehiguera.github.io"
ACCESS_TEAM = "mhiguera"
ACCESS_AUD = "82086987de48e659a9a08f64ccf534b0a35c4f8d51901bb731fb3569fbb4b76f,4b40649877e7b007bbdd7335e0c7680e68488cd40ea97ff50ecf1c709093e223"
BRANCH = "main"

[[routes]]
pattern = "www.fhiguera.fyi/portafolio/admin/api"
zone_name = "fhiguera.fyi"
